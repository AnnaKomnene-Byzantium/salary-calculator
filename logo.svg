<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="1000" height="600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=GFS+Didot&amp;display=swap');
      .bg { fill: #Fdfbf7; }
      .monogram { 
        font-family: 'GFS Didot', serif; 
        font-size: 100px; 
        font-weight: 400; 
      }
      .mono-a { 
        fill: #1a1a1a; 
      }
      .mono-k { 
        fill: #8c8c8c; 
      }
      .divider { 
        fill: none; 
        stroke: #2c2c2c; 
        stroke-width: 1.5; 
      }
      .brand-name { 
        font-family: 'GFS Didot', serif; 
        font-size: 18px; 
        fill: #1a1a1a; 
        font-weight: 400; 
        letter-spacing: 12px; 
      }
      .brand-origin { 
        font-family: 'Montserrat', sans-serif, Arial; 
        font-size: 10px; 
        fill: #8c8c8c; 
        letter-spacing: 15px; 
      }
    </style>
  </defs>
  
  <!-- Premium Alabaster Background -->
  <rect width="100%" height="100%" class="bg" />
  
  <!-- Monogram -->
  <text x="225" y="130" text-anchor="middle" class="monogram mono-a">Ά</text>
  <text x="275" y="142" text-anchor="middle" class="monogram mono-k">Κ</text>
  
  <!-- Divider Line -->
  <line x1="225" y1="165" x2="275" y2="165" class="divider" />
  
  <!-- Brand Texts -->
  <!-- Note: x offset slightly adjusted to visually center due to high letter-spacing -->
  <text x="256" y="205" text-anchor="middle" class="brand-name">ΆΝΝΑ ΚΟΜΝΗΝΉ</text>
  <text x="257" y="235" text-anchor="middle" class="brand-origin">CONSTANTINOPLE</text>
</svg>
