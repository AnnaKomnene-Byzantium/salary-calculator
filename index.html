<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Calculator</title>
    
    <!-- Google Fonts for Italian High Fashion Editorial style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;1,300&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=GFS+Didot&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Palette: Stark alabaster, deep charcoal, muted accents */
            --bg-color: #F8F7F3;
            --surface-color: #FFFFFF;
            --border-color: #E6E4DF;
            --border-dark: #1A1A1A;
            --text-primary: #111111;
            --text-secondary: #888888;
            --mgr-bg: #FDFCF9;
            --accent-green: #4A5D23; /* Muted olive */
            --accent-red: #8B3A3A;   /* Muted rust */
            
            --font-serif: 'Playfair Display', 'Songti SC', 'STSong', 'SimSun', 'FZSong-Extended', serif;
            --font-sans: 'Montserrat', '-apple-system', 'BlinkMacSystemFont', 'PingFang SC', 'Lantinghei SC', 'Microsoft YaHei', sans-serif;
            --transition-smooth: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            box-sizing: border-box;
            border-radius: 0 !important; /* Strict sharp edges for editorial look */
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 60px 40px 100px 40px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ------------------
           Header
           ------------------ */
        .page-header {
            text-align: center;
            margin-bottom: 80px;
            margin-top: 40px;
            position: relative;
        }
        
        .brand-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 45px;
            user-select: none;
        }
        .brand-logo .monogram {
            font-family: 'GFS Didot', serif;
            font-size: 4rem;
            line-height: 1;
            font-weight: 400;
            color: var(--text-primary);
            position: relative;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: -6px;
        }
        .brand-logo .monogram .m-left {
            transform: translateY(-3px);
            z-index: 2;
        }
        .brand-logo .monogram .m-right {
            transform: translateY(3px) translateX(-4px);
            color: var(--text-secondary);
            z-index: 1;
        }
        .brand-logo .monogram::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 25px;
            height: 1px;
            background-color: var(--border-dark);
        }
        .brand-logo .brand-name {
            font-family: 'GFS Didot', serif;
            font-size: 0.9rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 400;
            color: var(--text-primary);
            margin-bottom: 5px;
            margin-left: 5px;
        }
        .brand-logo .brand-origin {
            font-family: var(--font-sans);
            font-size: 0.5rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-left: 6px;
        }
        
        h1 {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 400;
            font-size: 5.5rem;
            line-height: 1.1;
            margin: 0 0 25px 0;
            letter-spacing: -1.5px;
            color: var(--text-primary);
        }
        
        .subtitle {
            font-family: var(--font-sans);
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }
        
        .history-btn-top {
            position: absolute;
            top: 20px;
            right: 40px;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--text-primary);
            padding: 0 0 4px 0;
            font-family: var(--font-sans);
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            color: var(--text-primary);
            transition: opacity 0.3s;
        }
        .history-btn-top:hover {
            opacity: 0.6;
        }

        /* ------------------
           Panels
           ------------------ */
        .panel {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 50px;
            margin-bottom: 30px;
        }

        .panel-label {
            font-family: var(--font-sans);
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-weight: 500;
        }

        /* ------------------
           Input Table
           ------------------ */
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 20px 25px;
            vertical-align: middle;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            font-weight: normal;
            padding-bottom: 30px;
            padding-top: 10px;
        }
        .row-label {
            width: 160px;
            font-family: var(--font-sans);
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 1px;
            color: var(--text-secondary);
            padding-left: 0;
            text-transform: uppercase;
        }
        .mgr-col {
            background-color: var(--mgr-bg);
        }
        
        .badge-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .badge {
            font-family: var(--font-sans);
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-primary);
            border-bottom: 1px solid var(--text-primary);
            padding-bottom: 4px;
        }
        .col-delete-btn {
            position: absolute;
            right: -30px;
            width: 22px;
            height: 22px;
            border-radius: 50% !important;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            color: var(--text-secondary);
            font-size: 14px;
            font-family: var(--font-sans);
            font-weight: 300;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            opacity: 0;
            transition: var(--transition-smooth);
            line-height: 1;
        }
        th:hover .col-delete-btn {
            opacity: 1;
        }
        .col-delete-btn:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
            transform: rotate(90deg);
        }

        input.cell-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 1.25rem;
            font-family: var(--font-serif);
            font-style: italic;
            color: var(--text-primary);
            outline: none;
            transition: color 0.3s;
        }
        input.cell-input::placeholder {
            color: #DFDDDB;
            font-style: italic;
        }
        input.cell-input:focus {
            color: var(--text-primary);
        }

        .add-btns {
            margin-top: 40px;
            display: flex;
            gap: 25px;
        }
        .btn-add {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0 0 6px 0;
            font-family: var(--font-sans);
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition-smooth);
        }
        .btn-add:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        /* ------------------
           Public Items Panel
           ------------------ */
        .public-grid {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 20px;
            align-items: center;
            margin-bottom: 30px;
        }
        .public-grid:last-child {
            margin-bottom: 0;
        }
        .public-label {
            font-family: var(--font-sans);
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 1px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        .public-input-wrap {
            max-width: 250px;
        }
        .public-input {
            border: none;
            border-bottom: 1px solid var(--border-color);
            background: transparent;
            outline: none;
            font-size: 1.5rem;
            font-family: var(--font-serif);
            font-style: italic;
            width: 100%;
            color: var(--text-primary);
            padding: 5px 0;
            transition: border-color 0.3s;
        }
        .public-input:focus {
            border-color: var(--text-primary);
        }

        /* ------------------
           Action Bar
           ------------------ */
        .action-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 80px;
            margin-top: 40px;
        }
        .btn-calc {
            flex-grow: 1;
            background: var(--text-primary);
            color: #fff;
            border: 1px solid var(--text-primary);
            padding: 22px;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition-smooth);
        }
        .btn-calc:hover { 
            background: transparent; 
            color: var(--text-primary);
        }
        
        .btn-action {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0 40px;
            font-family: var(--font-sans);
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition-smooth);
        }
        .btn-action:hover {
            border-color: var(--text-primary);
        }

        /* ------------------
           Footer
           ------------------ */
        .footer {
            text-align: center;
            color: var(--text-secondary);
            font-family: var(--font-sans);
            font-size: 0.65rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 100px;
            position: relative;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 20px;
            background: var(--border-color);
        }

        /* ---------------------------------
           Editorial Results Grid
           --------------------------------- */
        #results { display: none; }
        .editorial-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            align-items: start;
        }
        .editorial-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 45px 35px 35px 35px;
            position: relative;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInCard 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }
        .editorial-card.manager {
            background: var(--mgr-bg);
        }
        .card-badge {
            position: absolute;
            top: 35px;
            left: 35px;
            font-family: var(--font-sans);
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }
        .card-name {
            font-family: var(--font-serif);
            font-size: 2.8rem;
            font-style: italic;
            font-weight: 400;
            margin-top: 30px;
            margin-bottom: 15px;
            color: var(--text-primary);
            line-height: 1.1;
        }
        .card-subtitle {
            font-family: var(--font-sans);
            font-size: 0.75rem;
            font-weight: 400;
            color: var(--text-secondary);
            line-height: 1.8;
            letter-spacing: 0.5px;
            margin-bottom: 45px;
        }
        .card-lines {
            display: flex; flex-direction: column; gap: 20px;
        }
        .line-item {
            display: flex; justify-content: space-between; align-items: baseline; font-size: 0.75rem; 
            font-family: var(--font-sans); letter-spacing: 1px; text-transform: uppercase;
            color: var(--text-secondary);
        }
        .val-black { color: var(--text-primary); font-family: var(--font-serif); font-size: 1.3rem; font-style: italic; letter-spacing: 0; text-transform: none; }
        .val-green { color: var(--accent-green); font-family: var(--font-serif); font-size: 1.3rem; font-style: italic; letter-spacing: 0; text-transform: none; }
        .val-red { color: var(--accent-red); font-family: var(--font-serif); font-size: 1.3rem; font-style: italic; letter-spacing: 0; text-transform: none; }
        .card-total-divider {
            height: 1px; background-color: var(--border-dark); margin: 35px 0 25px 0;
        }
        .total-row {
            color: var(--text-primary); align-items: baseline;
        }
        .total-row span:first-child { font-size: 0.85rem; font-weight: 500; letter-spacing: 2px; }
        .val-total { font-family: var(--font-serif); font-size: 2.5rem; font-weight: 400; font-style: italic; letter-spacing: -0.5px; }
        .avg-diff {
            margin-top: 30px; font-family: var(--font-sans); font-size: 0.7rem; letter-spacing: 1px; display: flex; justify-content: space-between; text-transform: uppercase;
        }
        .diff-up { color: var(--accent-green); font-weight: 500;}
        .diff-down { color: var(--accent-red); font-weight: 500;}
        .diff-val-up, .diff-val-down { color: var(--text-primary); font-family: var(--font-serif); font-size: 0.95rem; font-style: italic; }

        /* Modal specific styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(248, 247, 243, 0.96); z-index: 1000;
            display: none; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.5s;
            backdrop-filter: blur(5px);
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content {
            background: var(--surface-color); border: 1px solid var(--border-color);
            width: 90%; max-width: 600px; max-height: 80vh; padding: 50px;
            display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.05);
        }
        .history-list { overflow-y: auto; flex-grow: 1; padding-right: 10px; margin-top: 30px; }
        .record-card { 
            border: none; border-bottom: 1px solid var(--border-color); 
            padding: 20px 0; margin-bottom: 0; background: transparent; 
        }
        .record-card:last-child { border-bottom: none; }
        .record-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 15px; font-family: var(--font-serif); font-size: 1.4rem; font-style: italic; }
        .record-actions { display: flex; justify-content: flex-end; gap: 15px; margin-top: 20px; }
        
        /* Modal Scrollbar */
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-track { background: transparent; }
        .history-list::-webkit-scrollbar-thumb { background: #DFDDDB; }

        @keyframes fadeInCard { to { opacity: 1; transform: translateY(0); } }
        /* ---------------------------------
           Mobile Responsiveness
           --------------------------------- */
        @media (max-width: 768px) {
            body {
                padding: 20px 15px 60px 15px;
            }
            .page-header {
                margin-top: 60px;
                margin-bottom: 50px;
            }
            .history-btn-top {
                top: 20px;
                right: 15px;
                font-size: 0.65rem;
            }
            h1 {
                font-size: 3.2rem;
                margin-bottom: 15px;
            }
            .subtitle {
                font-size: 0.65rem;
                letter-spacing: 3px;
                line-height: 1.6;
            }
            .panel {
                padding: 30px 20px;
                margin-bottom: 20px;
            }
            th, td {
                padding: 15px 15px;
            }
            .row-label {
                width: 100px;
                font-size: 0.7rem;
            }
            input.cell-input {
                font-size: 1.1rem;
                min-width: 80px;
            }
            .add-btns {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
            .public-grid {
                grid-template-columns: 1fr;
                gap: 10px;
                margin-bottom: 25px;
            }
            .public-input-wrap {
                max-width: 100%;
            }
            .action-bar {
                flex-direction: column;
                gap: 15px;
                margin-bottom: 50px;
            }
            .btn-action {
                padding: 15px;
            }
            .editorial-grid {
                grid-template-columns: 1fr;
            }
            .editorial-card {
                padding: 35px 25px 25px 25px;
            }
            .card-badge {
                top: 25px;
                left: 25px;
            }
            .card-name {
                font-size: 2.2rem;
                margin-top: 25px;
            }
            .val-total {
                font-size: 2rem;
            }
            .modal-content {
                padding: 35px 20px;
                width: 92%;
            }
            .record-header {
                font-size: 1.2rem;
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>
<body>

<button class="history-btn-top" onclick="openHistory()">历史档案</button>

<!-- History Modal -->
<div id="history-modal" class="modal-overlay">
    <div class="modal-content">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <h2 style="font-family: var(--font-serif); font-style: italic; font-weight: 400; font-size: 2.5rem; margin:0; letter-spacing: -0.5px;">核算档案库</h2>
            <button class="btn" style="background: transparent; border: none; font-size: 2rem; font-weight: 300; padding: 0; cursor: pointer; color: var(--text-secondary); line-height: 1;" onclick="closeHistory()">×</button>
        </div>
        <div id="history-list" class="history-list"></div>
        <div style="margin-top: 30px; text-align: right; border-top: 1px solid var(--border-dark); padding-top: 30px;">
            <button class="btn-action" style="padding: 12px 25px; font-size: 0.7rem;" onclick="clearAllRecords()">清空所有档案</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="page-header">
        <div class="brand-logo">
            <div class="monogram">
                <span class="m-left">Ά</span><span class="m-right">Κ</span>
            </div>
            <div class="brand-name">ΆΝΝΑ ΚΟΜΝΗΝΉ</div>
            <div class="brand-origin">CONSTANTINOPLE</div>
        </div>
        <h1>Salary Calculator</h1>
        <div class="subtitle">绩效分配 · 多退少补 · 公平透明</div>
    </div>
    
    <div class="panel">
        <div class="panel-label">人员信息录入</div>
        <div class="table-container" id="table-container">
            <!-- Table rendered by JS -->
        </div>
        <div class="add-btns">
            <button class="btn-add" onclick="addPerson('manager')">+ 添加店长</button>
            <button class="btn-add" onclick="addPerson('employee')">+ 添加店员</button>
        </div>
    </div>

    <div class="panel">
        <div class="panel-label">公共数据基准</div>
        <div class="public-grid">
            <div class="public-label">本月满勤天数</div>
            <div class="public-input-wrap">
                <input type="number" id="standard_days" class="public-input" value="30">
            </div>
        </div>
        <div class="public-grid">
            <div class="public-label">店长绩效总额</div>
            <div class="public-input-wrap">
                <input type="number" id="global_manager_perf" class="public-input" value="3000">
            </div>
        </div>
    </div>

    <div class="action-bar">
        <button class="btn-calc" onclick="calculate()">执行核算</button>
        <button class="btn-action" onclick="resetForm()">清空表单</button>
        <button class="btn-action" onclick="saveRecord()">保存记录</button>
    </div>

    <div id="results">
        <div class="editorial-grid" id="results-content"></div>
    </div>

    <div class="footer">
        POWERED BY ANNAKOMNENE
    </div>
</div>

<script>
    let personnel = [];
    let lastCalculationState = null;
    let mCount = 0;
    let eCount = 0;

    function initDefaultData() {
        personnel = [];
        mCount = 0; eCount = 0;
        document.getElementById('standard_days').value = '';
        document.getElementById('global_manager_perf').value = '';
        renderTable();
    }

    function addPerson(type) {
        if (type === 'manager') {
            mCount++;
            personnel.push({ id: 'm'+mCount, type: 'manager', name: '店长', base: '', days: '', indPerf: '', bonus: '' });
        } else {
            eCount++;
            personnel.push({ id: 'e'+eCount, type: 'employee', name: '店员', base: '', days: '', indPerf: '', bonus: '' });
        }
        renderTable();
    }

    function removePerson(id) {
        if (!confirm('确定要移除此人员记录吗？')) return;
        personnel = personnel.filter(p => p.id !== id);
        renderTable();
    }

    function updateData(id, field, value) {
        const p = personnel.find(x => x.id === id);
        if (p) {
            p[field] = value;
        }
    }

    function renderTable() {
        const container = document.getElementById('table-container');
        if (personnel.length === 0) {
            container.innerHTML = '<div style="font-family: var(--font-sans); font-size: 0.8rem; color: var(--text-secondary); letter-spacing: 1px; padding: 30px 0; text-transform: uppercase;">暂无人员信息录入。</div>';
            return;
        }

        let html = `<table><thead><tr><th></th>`;
        
        // Headers
        personnel.forEach(p => {
            const isMgr = p.type === 'manager';
            const badgeText = isMgr ? '店长' : '店员';
            html += `<th class="${isMgr ? 'mgr-col' : ''}">
                        <div class="badge-wrapper">
                            <div class="badge">${badgeText}</div>
                            <div class="col-delete-btn" onclick="removePerson('${p.id}')" title="移除此列">×</div>
                        </div>
                     </th>`;
        });
        html += `</tr></thead><tbody>`;

        // Row: Name
        html += `<tr><td class="row-label">姓名</td>`;
        personnel.forEach(p => {
            html += `<td class="${p.type === 'manager' ? 'mgr-col' : ''}"><input class="cell-input" type="text" value="${p.name}" oninput="updateData('${p.id}', 'name', this.value)" placeholder="姓名"></td>`;
        });
        html += `</tr>`;

        // Row: Base
        html += `<tr><td class="row-label">基本工资</td>`;
        personnel.forEach(p => {
            html += `<td class="${p.type === 'manager' ? 'mgr-col' : ''}"><input class="cell-input" type="number" value="${p.base}" oninput="updateData('${p.id}', 'base', this.value)" placeholder="0.00"></td>`;
        });
        html += `</tr>`;

        // Row: Days
        html += `<tr><td class="row-label">出勤天数</td>`;
        personnel.forEach(p => {
            html += `<td class="${p.type === 'manager' ? 'mgr-col' : ''}"><input class="cell-input" type="number" value="${p.days}" oninput="updateData('${p.id}', 'days', this.value)" placeholder="0"></td>`;
        });
        html += `</tr>`;

        // Row: IndPerf
        html += `<tr><td class="row-label">绩效基数</td>`;
        personnel.forEach(p => {
            html += `<td class="${p.type === 'manager' ? 'mgr-col' : ''}"><input class="cell-input" type="number" value="${p.indPerf}" oninput="updateData('${p.id}', 'indPerf', this.value)" placeholder="0.00"></td>`;
        });
        html += `</tr>`;

        // Row: Bonus
        html += `<tr><td class="row-label">其它奖惩</td>`;
        personnel.forEach(p => {
            html += `<td class="${p.type === 'manager' ? 'mgr-col' : ''}"><input class="cell-input" type="number" value="${p.bonus}" oninput="updateData('${p.id}', 'bonus', this.value)" placeholder="0.00"></td>`;
        });
        html += `</tr>`;

        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    function resetForm() {
        if (!confirm("确认要清空当前表格中录入的所有数据吗？")) return;
        personnel = [];
        mCount = 0; eCount = 0;
        document.getElementById('standard_days').value = '';
        document.getElementById('global_manager_perf').value = '';
        document.getElementById('results').style.display = 'none';
        lastCalculationState = null;
        renderTable();
    }

    function calculate() {
        const standardDays = parseFloat(document.getElementById('standard_days').value);
        if (!standardDays || standardDays <= 0) {
            alert('请输入正确的本月满勤天数');
            return;
        }
        
        const globalManagerPerf = parseFloat(document.getElementById('global_manager_perf').value) || 0;

        if (personnel.length === 0) {
            alert('人员列表为空，无法核算');
            return;
        }

        let totalDays = 0;
        let totalIndPerf = 0;
        let totalBonus = 0;
        let managers = [];
        let employees = [];

        personnel.forEach(p => {
            const parsed = {
                name: p.name || '未命名',
                base: parseFloat(p.base) || 0,
                days: parseFloat(p.days) || 0,
                indPerf: parseFloat(p.indPerf) || 0,
                bonus: parseFloat(p.bonus) || 0
            };
            totalDays += parsed.days;
            totalIndPerf += parsed.indPerf;
            totalBonus += parsed.bonus;
            
            if (p.type === 'manager') {
                managers.push(parsed);
            } else {
                employees.push(parsed);
            }
        });

        managers.forEach(m => {
            m.perf = globalManagerPerf / (managers.length > 0 ? managers.length : 1);
        });

        let sharedManagerPerfPool = 0;
        managers.forEach(m => {
            const ratio = Math.min(m.days / standardDays, 1.0);
            m.keptPerf = (m.perf / 2) * ratio;
            sharedManagerPerfPool += (m.perf - m.keptPerf);
        });

        const dailyIndPerfRate = totalDays > 0 ? (totalIndPerf / totalDays) : 0;
        const dailyBonusRate = totalDays > 0 ? (totalBonus / totalDays) : 0;
        const dailyManagerPerfRate = totalDays > 0 ? (sharedManagerPerfPool / totalDays) : 0;

        let resultsHTML = '';
        let totalSalary = 0;
        let animDelay = 0;
        const totalPeople = personnel.length;
        
        managers.forEach(m => totalSalary += m.base + (dailyIndPerfRate * m.days) + (dailyBonusRate * m.days) + m.keptPerf + (dailyManagerPerfRate * m.days));
        employees.forEach(e => totalSalary += e.base + (dailyIndPerfRate * e.days) + (dailyBonusRate * e.days) + (dailyManagerPerfRate * e.days));
        
        const avgSalary = totalSalary / totalPeople;

        managers.forEach(m => {
            const indPerfShare = dailyIndPerfRate * m.days;
            const bonusShare = dailyBonusRate * m.days;
            const managerPerfShare = dailyManagerPerfRate * m.days;
            const finalManagerPerf = m.keptPerf + managerPerfShare;
            const finalSalary = m.base + indPerfShare + bonusShare + finalManagerPerf;

            const expectedSalary = m.base + m.indPerf + m.bonus + m.perf;
            const diff = finalSalary - expectedSalary;
            const isAboveExpected = diff >= 0;
            
            resultsHTML += `
                <div class="editorial-card manager" style="animation-delay: ${animDelay}s">
                    <div class="card-badge">店长</div>
                    <div class="card-name">${m.name}</div>
                    <div class="card-subtitle">
                        出勤: ${m.days} 天<br>
                        绩效基数: ${m.indPerf.toFixed(2)}<br>
                        固定奖惩: ${m.bonus >= 0 ? '+' : ''}${m.bonus.toFixed(2)}
                    </div>
                    <div class="card-lines">
                        <div class="line-item"><span>基本工资</span><span class="val-black">${m.base.toFixed(2)}</span></div>
                        <div class="line-item"><span>绩效分配</span><span class="val-green">+${indPerfShare.toFixed(2)}</span></div>
                        <div class="line-item"><span>均分奖惩</span><span class="${bonusShare >= 0 ? 'val-green' : 'val-red'}">${bonusShare >= 0 ? '+' : ''}${bonusShare.toFixed(2)}</span></div>
                        <div class="line-item"><span>店长绩效</span><span class="val-green">+${finalManagerPerf.toFixed(2)}</span></div>
                    </div>
                    <div class="card-total-divider"></div>
                    <div class="line-item total-row"><span>理论应得</span><span class="val-total">${finalSalary.toFixed(2)}</span></div>
                    <div class="avg-diff">
                        <span class="${isAboveExpected ? 'diff-up' : 'diff-down'}">${isAboveExpected ? '高于实际所得' : '低于实际所得'}</span>
                        <span class="${isAboveExpected ? 'diff-val-up' : 'diff-val-down'}">${isAboveExpected ? '+' : '-'}${Math.abs(diff).toFixed(2)}</span>
                    </div>
                </div>
            `;
            animDelay += 0.15;
        });

        employees.forEach(e => {
            const indPerfShare = dailyIndPerfRate * e.days;
            const bonusShare = dailyBonusRate * e.days;
            const managerPerfShare = dailyManagerPerfRate * e.days;
            const finalSalary = e.base + indPerfShare + bonusShare + managerPerfShare;

            const expectedSalary = e.base + e.indPerf + e.bonus;
            const diff = finalSalary - expectedSalary;
            const isAboveExpected = diff >= 0;
            
            resultsHTML += `
                <div class="editorial-card" style="animation-delay: ${animDelay}s">
                    <div class="card-badge">店员</div>
                    <div class="card-name">${e.name}</div>
                    <div class="card-subtitle">
                        出勤: ${e.days} 天<br>
                        绩效基数: ${e.indPerf.toFixed(2)}<br>
                        固定奖惩: ${e.bonus >= 0 ? '+' : ''}${e.bonus.toFixed(2)}
                    </div>
                    <div class="card-lines">
                        <div class="line-item"><span>基本工资</span><span class="val-black">${e.base.toFixed(2)}</span></div>
                        <div class="line-item"><span>绩效分配</span><span class="val-green">+${indPerfShare.toFixed(2)}</span></div>
                        <div class="line-item"><span>均分奖惩</span><span class="${bonusShare >= 0 ? 'val-green' : 'val-red'}">${bonusShare >= 0 ? '+' : ''}${bonusShare.toFixed(2)}</span></div>
                        <div class="line-item"><span>店长绩效</span><span class="val-green">+${managerPerfShare.toFixed(2)}</span></div>
                    </div>
                    <div class="card-total-divider"></div>
                    <div class="line-item total-row"><span>理论应得</span><span class="val-total">${finalSalary.toFixed(2)}</span></div>
                    <div class="avg-diff">
                        <span class="${isAboveExpected ? 'diff-up' : 'diff-down'}">${isAboveExpected ? '高于实际所得' : '低于实际所得'}</span>
                        <span class="${isAboveExpected ? 'diff-val-up' : 'diff-val-down'}">${isAboveExpected ? '+' : '-'}${Math.abs(diff).toFixed(2)}</span>
                    </div>
                </div>
            `;
            animDelay += 0.15;
        });

        lastCalculationState = {
            timestamp: new Date().toISOString(),
            standardDays,
            globalManagerPerf,
            totalPeople,
            personnel: JSON.parse(JSON.stringify(personnel)),
            averageSalary: avgSalary.toFixed(2)
        };

        const resultsContainer = document.getElementById('results');
        document.getElementById('results-content').innerHTML = resultsHTML;
        resultsContainer.style.display = 'block';
        
        setTimeout(() => {
            resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
    }

    // ======== History Logic ========
    function saveRecord() {
        if (!lastCalculationState) {
            alert("请先执行核算操作，得出账单后再保存！");
            return;
        }
        const d = new Date();
        const defaultName = `${d.getFullYear()}年${d.getMonth()+1}月核算档案`;
        const name = prompt("请为这份档案命名：", defaultName);
        if (!name) return;
        
        lastCalculationState.name = name;
        let records = [];
        try {
            const stored = localStorage.getItem('salary_records_v4');
            if (stored) records = JSON.parse(stored);
        } catch(e) {}
        
        records.unshift(lastCalculationState);
        localStorage.setItem('salary_records_v4', JSON.stringify(records));
        alert('档案保存成功！');
    }

    function openHistory() {
        renderHistory();
        const overlay = document.getElementById('history-modal');
        overlay.style.display = 'flex';
        void overlay.offsetWidth;
        overlay.classList.add('active');
    }

    function closeHistory() {
        const overlay = document.getElementById('history-modal');
        overlay.classList.remove('active');
        setTimeout(() => {
            overlay.style.display = 'none';
        }, 500);
    }

    function renderHistory() {
        let records = [];
        try {
            const stored = localStorage.getItem('salary_records_v4');
            if (stored) records = JSON.parse(stored);
        } catch(e) {}
        
        const container = document.getElementById('history-list');
        if (records.length === 0) {
            container.innerHTML = `<div style="font-family: var(--font-sans); font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-secondary); margin-top: 20px;">暂无任何核算档案。</div>`;
            return;
        }
        
        let html = '';
        records.forEach((rec, index) => {
            const d = new Date(rec.timestamp);
            const dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
            html += `
                <div class="record-card">
                    <div class="record-header">
                        <span>${rec.name}</span>
                        <span style="font-family: var(--font-sans); font-weight:400; font-style:normal; font-size:0.6rem; letter-spacing: 2px; text-transform: uppercase; color:var(--text-secondary);">${dateStr}</span>
                    </div>
                    <div style="font-family: var(--font-sans); font-size:0.7rem; color:var(--text-secondary); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 20px;">
                        总人数: ${rec.totalPeople} &nbsp;&nbsp;|&nbsp;&nbsp; 人均: ${rec.averageSalary}
                    </div>
                    <div class="record-actions">
                        <button class="btn-add" style="font-size: 0.65rem;" onclick="restoreRecord(${index})">恢复数据</button>
                        <button class="btn-add" style="font-size: 0.65rem; color: var(--accent-red); border-color: transparent;" onclick="deleteRecord(${index})">永久删除</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function deleteRecord(index) {
        if (!confirm('此操作不可逆，确定永久删除该条档案吗？')) return;
        let records = JSON.parse(localStorage.getItem('salary_records_v4') || '[]');
        records.splice(index, 1);
        localStorage.setItem('salary_records_v4', JSON.stringify(records));
        renderHistory();
    }

    function clearAllRecords() {
        let records = JSON.parse(localStorage.getItem('salary_records_v4') || '[]');
        if (records.length === 0) return;
        if (!confirm('警告：您确定要清空档案库中的所有数据吗？')) return;
        localStorage.removeItem('salary_records_v4');
        renderHistory();
    }

    function restoreRecord(index) {
        let records = JSON.parse(localStorage.getItem('salary_records_v4') || '[]');
        const rec = records[index];
        if (!rec) return;
        
        if (!confirm(`是否将表单数据恢复为【${rec.name}】？`)) return;

        document.getElementById('standard_days').value = rec.standardDays || '30';
        document.getElementById('global_manager_perf').value = rec.globalManagerPerf || '0';
        
        personnel = rec.personnel;
        mCount = personnel.filter(p => p.type === 'manager').length;
        eCount = personnel.filter(p => p.type === 'employee').length;
        
        renderTable();
        document.getElementById('results').style.display = 'none';
        closeHistory();
    }

    // Initialize with default values
    initDefaultData();
</script>

</body>
</html>
