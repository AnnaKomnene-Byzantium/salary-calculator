<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="1000" height="600">
  <defs>
    <style type="text/css">
      <![CDATA[
        @import url('https://fonts.googleapis.com/css2?family=GFS+Didot');
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400');
        
        .bg { fill: #Fdfbf7; }
        
        .monogram { 
          font-family: 'GFS Didot', 'Didot', 'Bodoni MT', serif; 
          font-size: 80px; 
          font-weight: 400; 
        }
        .mono-a { 
          fill: #1a1a1a; 
        }
        .mono-k { 
          fill: #8c8c8c; 
        }
        
        .divider { 
          fill: none; 
          stroke: #1a1a1a; 
          stroke-width: 1.5; 
        }
        
        .brand-name { 
          font-family: 'GFS Didot', 'Didot', 'Bodoni MT', serif; 
          font-size: 16px; 
          fill: #1a1a1a; 
          font-weight: 400; 
          letter-spacing: 12px; 
        }
        
        .brand-origin { 
          font-family: 'Montserrat', sans-serif, Arial; 
          font-size: 9px; 
          fill: #8c8c8c; 
          letter-spacing: 15px; 
        }
      ]]>
    </style>
  </defs>
  
  <!-- Premium Alabaster Background -->
  <rect width="100%" height="100%" class="bg" />
  
  <!-- Monogram -->
  <text x="235" y="130" text-anchor="middle" class="monogram mono-a">Ά</text>
  <text x="265" y="140" text-anchor="middle" class="monogram mono-k">Κ</text>
  
  <!-- Divider Line (Centered at 250, 25px wide) -->
  <line x1="237.5" y1="160" x2="262.5" y2="160" class="divider" />
  
  <!-- Brand Texts -->
  <!-- Shifted slightly right (x=256) to compensate for letter-spacing on the last character -->
  <text x="256" y="200" text-anchor="middle" class="brand-name">ΆΝΝΑ ΚΟΜΝΗΝΉ</text>
  
  <!-- Shifted slightly right (x=257.5) to compensate for 15px letter-spacing -->
  <text x="257.5" y="230" text-anchor="middle" class="brand-origin">CONSTANTINOPLE</text>
</svg>
